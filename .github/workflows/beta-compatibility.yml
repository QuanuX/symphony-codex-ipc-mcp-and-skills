name: Beta compatibility

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'third_party/**'
      - 'catalog/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - 'adapters/**'
      - 'skills/**'
      - 'ci/**'
      - 'CMakeLists.txt'
      - '*mcp.json'
      - 'plugin.json'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.github/workflows/beta-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare isolated build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --only-binary=:all: cmake==3.31.6
      - name: Build and exercise affected bridge contracts
        run: |
          "$RUNNER_TEMP/tools/bin/python" ci/qualify_local.py \
            --source . --out "$RUNNER_TEMP/result" --compiler /usr/bin/clang++ \
            --cmake "$RUNNER_TEMP/tools/bin/cmake" --ctest "$RUNNER_TEMP/tools/bin/ctest" \
            --expected-os macos --expected-arch arm64 --host-kind vm --macos-deployment-target 14.0
          "$RUNNER_TEMP/tools/bin/python" tests/test_mcpb.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: beta-compatibility-fixtures
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 14
